# https://taskfile.dev
#
# The same commands CI and lefthook run, so a local pass means what a green
# check means.
version: '3'

vars:
  # Below the measured number on purpose, so a small refactor does not fail it.
  GATE: 88

tasks:
  default:
    silent: true
    cmds:
      - task --list

  build:
    desc: Compile every package, discarding the output
    cmds:
      - go build ./...

  test:
    desc: Race and shuffle, without the coverage instrumentation
    cmds:
      - go test -race -shuffle=on ./...

  cover:
    desc: The full test run, failing under the coverage gate
    cmds:
      - go test -race -shuffle=on -coverpkg=./... -coverprofile=cover.out ./...
      - go tool cover -func=cover.out | tail -1
      - >-
        go tool cover -func=cover.out |
        awk '/^total:/ { gsub(/%/, "", $3); if ($3 + 0 < {{.GATE}}) {
        print "coverage " $3 "% is under the {{.GATE}}% gate"; exit 1 } }'

  lint:
    desc: A tidy and verified go.mod, no pending go fix modernization, golangci-lint, the formatter check, and no em or en dash
    cmds:
      - go mod tidy -diff
      - go mod verify
      - go fix -diff ./...
      - golangci-lint run
      - golangci-lint fmt --diff
      - scripts/check-dashes.sh

  vuln:
    desc: Known vulnerabilities in the code paths equip actually calls
    cmds:
      - go tool govulncheck ./...
