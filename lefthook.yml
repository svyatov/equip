# Install once: mise install && mise x -- lefthook install

pre-commit:
  jobs:
    - name: fmt
      glob: "*.go"
      run: mise x -- golangci-lint fmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: &go ["*.go", "go.mod", "go.sum", ".golangci.yml", "mise.toml"]
      run: mise run lint
    - name: test
      glob: *go
      run: mise run test
